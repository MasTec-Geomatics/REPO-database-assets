[project]
name = "repo-loaders"
version = "0.1.0"
description = "Loaders and migrations for the REPO GIS database: public federal and Texas risk-screening data in PostGIS for QGIS"
readme = "README.md"
authors = [
    { name = "Heath Babb", email = "hbabb@hey.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
]

[project.scripts]
repo-load = "repo_loaders.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "rich>=15.0.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modern syntax for the target version)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
